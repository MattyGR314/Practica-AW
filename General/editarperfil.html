<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/style.css">
    <title>Editar tu Perfil</title>
</head>

<body>
    <div id="header"></div>

    <h1>Editar tu Perfil</h1>

    <form id="editar-perfil-form">
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" class="form-control" id="nombre" name="nombre"> <!-- hay que mirar si dejandolos en blanco se podria no modifican en la bbdd-->
        </div>
        <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" class="form-control" id="email" name="email">
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" class="form-control" id="password" name="password">
        </div>
        <div class="form-group">
            <label for="accesibilidad">Preferencias de Accesibilidad:</label>
            <input type="checkbox" class="form-control" id="daltonico" name="daltonico">
            <label for="modo daltónico">Activar modo daltónico</label>
            <input type="checkbox" class="form-control" id="sordos" name="sordos">
            <label for="modo sordo">Activar modo sordo</label>
        </div>
        <button type="submit" class="btn btn-primary" onclick="window.location.href='perfil.html'">Guardar Cambios</button>
    </form>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <div id="footer"></div>
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
</body>
