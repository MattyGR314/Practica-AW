<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="header"></div>

    <form action="procesar.php" method="post">
        <button class="volver" onclick="window.location.href='inicio-sesion.html'"><img src="../img/arrow-left-circle.png" alt="Volver"></button>
        
      <nav class ="migas" aria-label="Migas de pan">
        <ul class="breadcrumb">
            <li class="breadcrumb-item"><a href="../General/index.html">Inicio-></a></li>
            <li class="breadcrumb-item">Registrarse</a></li>
        </ul>
      </nav>
        
        <h1>Registrarse</h1>
        <!-- el procesar.php es donde se mandan los datos del formulario, queremos que vayan a la BBDD-->
          <div class="form-gupo">
            <p>Nombre: </p>
            <input type="text" name="name" placeholder="Tu nombre" required>
         </div>
          <div class="form-gupo">
            <p>Apellidos: </p>
            <input type="text" name="last_name" placeholder="Tus apellidos" required>
         </div>
         <div class="form-gupo">
            <p>Email: </p>
            <input type="email" name="mail" placeholder="ejemplo@gmail.com" required>
         </div>
        
         <div class="form-gupo">
            <p>Contraseña: </p>
            <input type="password" name="password" placeholder="Contraseña" required>
         </div>

         <div class="form-gupo">
            <p>Confirmar Contraseña: </p>
            <input type="password" name="confirm_password" placeholder="Confirmar Contraseña" required>
         </div>
        <br>
        <button type="submit">Registrarse</button>
    </form>
    <div id="footer"></div>
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
</body>
