        <h1>Registrarse</h1>
        <!-- el procesar.php es donde se mandan los datos del formulario, queremos que vayan a la BBDD-->
          <div class="form-gupo">
            <p>Nombre: </p>
            <input type="text" name="name" placeholder="Tu nombre" required>
         </div>
          <div class="form-gupo">
            <p>Apellidos: </p>
            <input type="text" name="last_name" placeholder="Tus apellidos" required>
         </div>
         <div class="form-gupo">
            <p>Email: </p>
            <input id="email" type="email" name="mail" placeholder="ejemplo@gmail.com" required>
         </div>
        
         <div class="form-gupo">
            <p>Contraseña: </p>
            <input id="password" type="password" name="password" placeholder="Contraseña" required>
         </div>

         <div class="form-gupo">
            <p>Confirmar Contraseña: </p>
            <input id="confirm_password" type="password" name="confirm_password" placeholder="Confirmar Contraseña" required>
         </div>
        <br>
        <button id="submitbt" type="submit">Registrarse</button>
    </form>
