<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/form.css">
</head>
<body>
    <form action="procesar.php" method="post">
        <button class="volver" onclick="window.location.href='index.html'"><img src="img/arrow-left-circle.png" alt="Volver"></button>
         <h1>Iniciar Sesión</h1>
        <!-- el procesar.php es donde se mandan los datos del formulario, queremos que vayan a la BBDD-->
         <div class="form-gupo">
            <p>Email: </p>
            <input type="email" name="mail" placeholder="ejemplo@gmail.com" required>
         </div>
        
         <div class="form-gupo">
            <p>Contraseña: </p>
            <input type="password" name="password" placeholder="Contraseña" required>
         </div>
        <br>
        <button type="submit">Iniciar Sesión</button>
        <button type="button" onclick="window.location.href='registro.html'">Registrarse</button>
    </form>
</body>
