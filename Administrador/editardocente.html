<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/style.css">
    <title>Editar Docente</title>
</head>
<body>
    <div id="header"></div>

    <nav class="migas" aria-label="Migas de pan">
        <ul class="breadcrumb">
            <li class="breadcrumb-item"><a href="../General/index.html">Inicio</a></li>
            <li class="breadcrumb-item"><a href="administracion.html">Administración</a></li>
            <li class="breadcrumb-item"><a href="gestionardocentes.html">Gestionar Docentes</a></li>
            <li class="breadcrumb-item" aria-current="page">Editar Docente</li>
        </ul>
    </nav>

    <form>
        <h1>Editar Docente</h1>
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre">
        </div>
        <div class="form-group">
            <label for="apellidos">Apellidos:</label>
            <input type="text" class="form-control" id="apellidos" name="apellidos" placeholder="Apellidos">
        </div>
        <div class="form-group">
            <label for="especialidad">Especialidad:</label>
            <input type="text" class="form-control" id="especialidad" name="especialidad" placeholder="Especialidad">
        </div>
        <div class="form-group">
            <label for="correo">Correo electrónico:</label>
            <input type="email" class="form-control" id="correo" name="correo" placeholder="correo@fdi.ucm.es">
        </div>
        <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Teléfono">
        </div>
        <div class="form-group">
            <label for="estado">Estado:</label>
            <input type="text" class="form-control" id="estado" name="estado" placeholder="Activo">
        </div>
        <button type="button" onclick="window.location.href='gestionardocentes.html'">Guardar Cambios</button>
    </form>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <div id="footer"></div>
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
</body>
</html>
